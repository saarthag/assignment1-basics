# Example Transformer LM training config.
# Copy to `train_config.toml` and run:
#     python -m cs336_basics.train -c train_config.toml
#
# `dataset`, `valid_dataset` and `tokenizer` accept local paths or s3://bucket/key
# URIs; remote inputs are downloaded into the current working directory, mirroring
# their bucket key layout. `tokenizer`
# points to a tokenizer experiment directory laid out like experiments/tokenizer-v1
# (i.e. it contains training/vocab.pkl and training/merges.pkl). Credentials for
# S3-compatible storage are read from the environment (see cs336_basics/storage.py).

# --- data / tokenizer ------------------------------------------------------- #
dataset = "data/tinystories/tinystories_10.txt"
# valid_dataset = "data/TinyStoriesV2-GPT4-valid.txt"
# dataset = "s3://my-bucket/data/tinystories_10.txt"
# tokenizer = "s3://my-bucket/experiments/tokenizer-v1"
tokenizer = "experiments/tokenizer-v1"

# --- run / artifacts -------------------------------------------------------- #
# run_id = "my-run"                  # default: generated (8-char base-36)
# work_dir = "training"             # default: $TMPDIR/_work_<run_id>
# upload_uri = "s3://my-bucket/runs"  # publish artifacts + checkpoints to <upload_uri>/<run_id>/

# --- model ------------------------------------------------------------------ #
# vocab_size is resolved from the tokenizer's training/meta.json.
d_model = 256
num_layers = 4
context_length = 256
theta = 10000.0
num_heads = 8
# d_ff = 704              # optional; defaults to 8/3 * d_model rounded to 64

# --- optimization ----------------------------------------------------------- #
batch_size = 32
num_epochs = 1
max_lr = 3e-4
min_lr = 3e-5
warmup_fraction = 0.1
cosine_fraction = 1.0
weight_decay = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
grad_clip = 1.0
seed = 0
device = "auto"
dtype = "float32"

# --- logging / wandb -------------------------------------------------------- #
log_every = 1
eval_every = 100
eval_batches = 20
checkpoint_every = 500
use_wandb = true
wandb_project = "cs336-assignment1"
# wandb_entity = ""
# notes = """
# Free-text markdown shown on the wandb run, e.g. design decisions.
# """
# tags = ["baseline", "tinystories"]
# hardware_flops = 1e13    # optional override for the dry-run time estimate
